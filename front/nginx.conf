server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SEO and Security Headers (TOP STANDARDS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HSTS - Enforces HTTPS only. Use only after securing SSL/TLS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # GZIP Compression for fast load times
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/javascript application/x-javascript text/javascript application/json application/xml;

    # Handle React/Vite routing (pushState history)
    location / {
        try_files $uri $uri/ /index.html;
    }
}