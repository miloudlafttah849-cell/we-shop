version: '3.8'

services:
  # 1. MongoDB Service
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/home/miloudlafttah849/we-shop/data/db # Persist data
    # Health check for MongoDB readiness
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet
      interval: 5s
      timeout: 30s
      retries: 5
  
  # 2. Backend Service (Node/Express with PM2)
  backend:
    build:
      context: ./back
      target: production # Use your production stage in Dockerfile
    container_name: backend
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}' # Your API port
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI}
      # ... other env variables
    depends_on:
      mongo:
        condition: service_healthy # WAIT for MongoDB healthcheck to pass!
    restart: always # Docker Compose handles the container restart if PM2 fails
    # This healthcheck ensures the backend is connected to the DB before other services start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-3000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Frontend Service (React Vite)
  frontend:
    build: ./front
    container_name: frontend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy # Wait for backend healthcheck to pass
    restart: always

  # 4. Admin Service (CRA React)
  admin:
    build: ./admin
    container_name: admin
    ports:
      - '${ADMIN_PORT:-8080}:80' # Expose on a different port
    depends_on:
      backend:
        condition: service_healthy # Wait for admin healthcheck to pass
    restart: always

# ---
# This is the corrected and required section to define the named volume:
volumes:
  mongo-data: # Declares the named volume used by the 'mongo' service
    driver: local
